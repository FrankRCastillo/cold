[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cold"
version = "0.1.0"
description = "CLI downloader / search tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "lxml>=5.0",
  "wcwidth",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cold = ["config/*"]

[project.scripts]
cold = "cold.__main__:main"
